services:
  - type: web
    name: kritika-portfolio
    runtime: static
    rootDir: artifacts/kritika-portfolio
    buildCommand: npm install && npm run build
    staticPublishPath: dist/public
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
