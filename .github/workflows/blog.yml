name: Blog to Blogger

# Writes one blog post with Gemini and emails it to the secret Blogger
# posting address. Runs Monday, Wednesday and Friday at 09:00 IST.

on:
  schedule:
    # Mon, Wed, Fri at 09:00 IST (03:30 UTC)
    - cron: '30 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to write about (optional - otherwise the next topic in the list is used)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: blog-to-blogger
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blog-automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: blog-automation/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write the post and email it to Blogger
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
        run: python post_blog.py "${{ github.event.inputs.topic || '' }}"
